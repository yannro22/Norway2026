<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Norway Trip Pro</title>
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#0a1128">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <style>
        :root {
            --bg-color: #0a1128;
            --panel-bg: #162447; 
            --accent-color: #e0e1dd;
            --text-color: #f5f5f5;
            --border-color: #1f4068;
            --norway-red: #ba0c2f;
            --nav-height: 70px;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 0;
            height: 100vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        /* Header */
        header {
            background: var(--panel-bg);
            padding: 15px;
            text-align: center;
            border-bottom: 2px solid var(--norway-red);
            font-size: 18px;
            font-weight: bold;
        }

        /* Content Area */
        .content-wrapper {
            flex: 1;
            overflow-y: auto;
            padding: 15px;
            padding-bottom: 100px; /* Space for nav */
        }

        .tab-content { display: none; }
        .tab-content.active { display: block; }

        /* Bottom Navigation */
        .nav-bar {
            position: fixed;
            bottom: 0;
            width: 100%;
            height: var(--nav-height);
            background: var(--panel-bg);
            display: flex;
            border-top: 1px solid var(--border-color);
            z-index: 1000;
        }
        .nav-item {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            font-size: 11px;
            color: #888;
            cursor: pointer;
            border: none;
            background: none;
        }
        .nav-item.active {
            color: var(--norway-red);
        }
        .nav-item span { font-size: 20px; margin-bottom: 4px; }

        /* Component Styles */
        .card {
            background: var(--panel-bg);
            border: 1px solid var(--border-color);
            border-radius: 10px;
            padding: 15px;
            margin-bottom: 15px;
        }
        .checkbox-item {
            display: flex;
            align-items: center;
            padding: 12px 0;
            border-bottom: 1px solid #1f4068;
            gap: 10px;
        }
        input[type="checkbox"] { width: 22px; height: 22px; accent-color: var(--norway-red); }

        textarea, select {
            width: 100%;
            background: #0a1128;
            color: white;
            border: 1px solid var(--border-color);
            padding: 10px;
            border-radius: 6px;
            margin-top: 5px;
        }

        #map { height: 350px; border-radius: 8px; width: 100%; margin-top: 10px; }

        .route-info {
            background: #1e3157;
            padding: 10px;
            border-radius: 6px;
            font-size: 13px;
            margin-top: 10px;
            border-left: 4px solid var(--norway-red);
        }

        /* Weather UI */
        .weather-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 15px; }
        .weather-stat { background: #0a1128; padding: 10px; border-radius: 6px; text-align: center; }

        /* Timeline Icons */
        .day-header {
            display: flex;
            justify-content: space-between;
            border-bottom: 1px solid var(--norway-red);
            padding-bottom: 5px;
            margin-bottom: 10px;
            font-weight: bold;
        }
    </style>
</head>
<body>

    <header>
        🇳🇴 <span id="header-title">Packing List</span>
    </header>

    <div class="content-wrapper">
        
        <!-- 1. PACKING TAB -->
        <div id="tab-packing" class="tab-content active">
            <div class="card" id="packing-container"></div>
        </div>

        <!-- 2. SCHEDULE TAB -->
        <div id="tab-schedule" class="tab-content">
            <div id="timeline-container"></div>
        </div>

        <!-- 3. MAP TAB -->
        <div id="tab-map" class="tab-content">
            <div class="card">
                <label style="font-size: 12px;">Route Planner</label>
                <div style="display: flex; gap: 5px; margin-bottom: 10px;">
                    <select id="route-start"></select>
                    <select id="route-end"></select>
                </div>
                <button onclick="calculateDrivingRoute()" style="width: 100%; padding: 12px; background: var(--norway-red); color: white; border: none; border-radius: 6px; font-weight: bold;">🚗 Calculate Route</button>
                <div id="route-results" class="route-info" style="display:none;"></div>
                <div id="map"></div>
            </div>
        </div>

        <!-- 4. WEATHER TAB -->
        <div id="tab-weather" class="tab-content">
            <div class="card">
                <h3>Location Forecast</h3>
                <select id="weather-city" onchange="fetchWeather()"></select>
                <div id="weather-display" style="text-align: center; padding: 20px 0;">
                    <p>Select a city to see weather...</p>
                </div>
            </div>
        </div>

    </div>

    <nav class="nav-bar">
        <button class="nav-item active" onclick="switchTab('packing', this)"><span>🎒</span>Packing</button>
        <button class="nav-item" onclick="switchTab('schedule', this)"><span>🗓️</span>Schedule</button>
        <button class="nav-item" onclick="switchTab('map', this)"><span>🗺️</span>Map</button>
        <button class="nav-item" onclick="switchTab('weather', this)"><span>☁️</span>Weather</button>
    </nav>

    <script>
        const locations = {
            "Oslo": { coords: [59.9139, 10.7522], icon: "🏢" },
            "Bergen": { coords: [60.3913, 5.3221], icon: "🏢" },
            "Lillehammer": { coords: [61.1153, 10.4662], icon: "🏢" },
            "Andalsnes": { coords: [62.5674, 7.6872], icon: "🛖" },
            "Geiranger": { coords: [62.1015, 7.2059], icon: "⛰️" },
            "Flam": { coords: [60.8608, 7.1118], icon: "🛖" },
            "Loen": { coords: [61.8715, 6.8488], icon: "🛖" },
            "Trollstigen": { coords: [62.4531, 7.6690], icon: "⛰️" },
            "Bjorgi (Lake)": { coords: [60.6200, 6.4200], icon: "🏝️" },
            "Sognefjord": { coords: [61.1187, 6.4251], icon: "🌊" }
        };

        const packingItems = [
            "7x Underwear", "7x Socks", "Waterproof Raincoat", "Warm Puffer Jacket", 
            "Warm Hat/Gloves", "Trail Shoes", "Power Bank", "Passport", "Water Bottle"
        ];

        // PERSISTENCE
        function save() {
            const data = {
                checks: Array.from(document.querySelectorAll('#packing-container input')).map(c => c.checked),
                notes: Array.from(document.querySelectorAll('#timeline-container textarea')).map(t => t.value),
                regions: Array.from(document.querySelectorAll('#timeline-container select')).map(s => s.value)
            };
            localStorage.setItem('norway_pro_v2', JSON.stringify(data));
        }

        function load() {
            const saved = JSON.parse(localStorage.getItem('norway_pro_v2'));
            if (!saved) return;
            document.querySelectorAll('#packing-container input').forEach((c, i) => c.checked = saved.checks[i]);
            document.querySelectorAll('#timeline-container textarea').forEach((t, i) => t.value = saved.notes[i]);
            document.querySelectorAll('#timeline-container select').forEach((s, i) => s.value = saved.regions[i]);
        }

        // TABS
        function switchTab(tabId, el) {
            document.querySelectorAll('.tab-content').forEach(t => t.classList.remove('active'));
            document.querySelectorAll('.nav-item').forEach(n => n.classList.remove('active'));
            document.getElementById('tab-' + tabId).classList.add('active');
            el.classList.add('active');
            document.getElementById('header-title').innerText = el.innerText.replace(/[^\w\s]/gi, '').trim();
            if (tabId === 'map') setTimeout(() => map.invalidateSize(), 200);
        }

        // WEATHER (Fixed for mobile)
        async function fetchWeather() {
            const city = document.getElementById('weather-city').value;
            const coords = locations[city].coords;
            const display = document.getElementById('weather-display');
            display.innerHTML = "Fetching...";

            try {
                // met.no requires a unique User-Agent
                const response = await fetch(`https://api.met.no/weatherapi/locationforecast/2.0/compact?lat=${coords[0]}&lon=${coords[1]}`);
                const data = await response.json();
                const now = data.properties.timeseries[0].data.instant.details;
                const symbol = data.properties.timeseries[0].data.next_1_hours.summary.symbol_code;

                display.innerHTML = `
                    <h1 style="margin:0; font-size:48px;">${Math.round(now.air_temperature)}°</h1>
                    <p style="text-transform: capitalize; color: #aaa; margin-bottom:20px;">${symbol.replace(/_/g, ' ')}</p>
                    <div class="weather-grid">
                        <div class="weather-stat"><strong>Wind</strong><br>${now.wind_speed} m/s</div>
                        <div class="weather-stat"><strong>Humidity</strong><br>${now.relative_humidity}%</div>
                    </div>
                `;
            } catch (e) {
                display.innerHTML = "⚠️ API Error. Check connection.";
            }
        }

        // MAP ROUTING (Restored from Original)
        const map = L.map('map').setView([61.5, 8.5], 6);
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png').addTo(map);
        
        let currentRouteGroup = null;
        const routeColors = ['#ba0c2f', '#f3c623', '#3498db', '#2ecc71', '#e67e22'];

        async function calculateDrivingRoute() {
            const startName = document.getElementById('route-start').value;
            const endName = document.getElementById('route-end').value;
            const resultsDiv = document.getElementById('route-results');
            if (startName === endName) return;

            resultsDiv.style.display = "block";
            resultsDiv.innerHTML = "Calculating...";
            if (currentRouteGroup) map.removeLayer(currentRouteGroup);
            currentRouteGroup = L.featureGroup().addTo(map);

            const s = locations[startName].coords;
            const e = locations[endName].coords;

            try {
                const res = await fetch(`https://router.project-osrm.org/route/v1/driving/${s[1]},${s[0]};${e[1]},${e[0]}?overview=full&geometries=geojson&steps=true`);
                const data = await res.json();
                const route = data.routes[0];

                // Draw segments
                const steps = route.legs[0].steps;
                let roadsHtml = "<strong>Route Detail:</strong><ul style='margin:5px 0; padding-left:15px;'>";
                
                steps.forEach((step, idx) => {
                    const coords = step.geometry.coordinates.map(c => [c[1], c[0]]);
                    const roadName = step.name || "Main Road";
                    const color = routeColors[idx % routeColors.length];
                    
                    L.polyline(coords, {color: color, weight: 6}).addTo(currentRouteGroup);
                    
                    if(step.distance > 5000) { // Only show major roads
                        roadsHtml += `<li><span style="color:${color}">●</span> ${roadName} (${(step.distance/1000).toFixed(1)}km)</li>`;
                    }
                });

                resultsDiv.innerHTML = `
                    <strong>${(route.distance/1000).toFixed(1)} km</strong> | <strong>${Math.round(route.duration/60)} mins</strong><br>
                    ${roadsHtml}</ul>
                `;
                map.fitBounds(currentRouteGroup.getBounds());
            } catch (err) {
                resultsDiv.innerHTML = "Routing error.";
            }
        }

        // INIT
        function init() {
            // Packing List
            const pc = document.getElementById('packing-container');
            packingItems.forEach(item => {
                const div = document.createElement('div');
                div.className = 'checkbox-item';
                div.innerHTML = `<input type="checkbox" onchange="save()"> <span>${item}</span>`;
                pc.appendChild(div);
            });

            // Schedule
            const sc = document.getElementById('timeline-container');
            for(let i=1; i<=9; i++) {
                const card = document.createElement('div');
                card.className = 'card';
                card.innerHTML = `
                    <div class="day-header"><span>Day ${i}</span> <span>June ${11+i}</span></div>
                    <select onchange="save()">
                        <option value="fjord">Fjords ⛰️</option>
                        <option value="city">City 🏢</option>
                        <option value="travel">Transit 🚗</option>
                    </select>
                    <textarea oninput="save()" placeholder="Daily activities..."></textarea>
                `;
                sc.appendChild(card);
            }

            // Dropdowns & Markers
            const rs = document.getElementById('route-start');
            const re = document.getElementById('route-end');
            const wc = document.getElementById('weather-city');

            Object.entries(locations).forEach(([name, data]) => {
                const opt = `<option value="${name}">${data.icon} ${name}</option>`;
                rs.innerHTML += opt;
                re.innerHTML += opt;
                wc.innerHTML += opt;

                const markerIcon = L.divIcon({
                    html: `<div style="font-size:24px;">${data.icon}</div>`,
                    className: 'map-ico', iconSize: [24,24]
                });
                L.marker(data.coords, {icon: markerIcon}).addTo(map).bindPopup(name);
            });

            load();
            fetchWeather();
        }

        init();

        // Register PWA Service Worker
        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.register('service-worker.js');
        }
    </script>
</body>
</html>
